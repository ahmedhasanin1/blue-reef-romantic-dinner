<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blue Reef Resort | Romantic Dinner</title>
<style>
:root{--orange:#f7941d;--gold:#d9ad70;--ink:#17242a;--cream:#fff8ed}
*{box-sizing:border-box}body{margin:0;background:#111c22;color:#fff;font-family:Georgia,serif}
header{text-align:center;padding:28px 16px 22px;background:linear-gradient(135deg,#101b22,#493126)}
.brand{font:700 27px Arial,sans-serif;letter-spacing:-1px;color:var(--orange)}.brand span{color:#bbb}
h1{font-size:clamp(30px,6vw,48px);color:#f8c17b;margin:14px 0 6px;font-style:italic}
header p{margin:0 auto;max-width:650px;color:#f5e7d5}
.langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px;background:#17242a;position:sticky;top:0;z-index:3}
button{border:1px solid var(--gold);background:transparent;color:white;border-radius:20px;padding:9px 14px;font-size:14px;cursor:pointer}
button.active,button:hover{background:var(--orange);color:#17242a;font-weight:bold}
main{max-width:1000px;margin:auto;padding:22px 14px 40px}
.intro{text-align:center;color:#f2dfc7;margin:0 auto 22px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:#fffaf3;color:#202326;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #0006}
.card img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;object-position:top}
.content{padding:18px}.content h2{font-size:22px;color:#a85a13;margin:0 0 12px}
.price{font:700 30px Arial,sans-serif;color:#bd6412;margin:8px 0 14px}
.price small{font:14px Arial,sans-serif;color:#555}
h3{font:700 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:2px;color:#a85a13;margin:15px 0 5px}
.content p{line-height:1.45;margin:4px 0}
footer{text-align:center;background:#0d171c;padding:24px 16px;color:#f6e4ce;line-height:1.6}
footer strong{color:#f5a13a}
.note{font-size:13px;color:#555;margin-top:15px}
@media(max-width:480px){.card img{aspect-ratio:4/3}.langs{gap:6px}button{padding:8px 10px}}
</style></head><body>
<header><div class="brand">blue <span>reef</span> <small style="font-size:12px;color:#f7941d">RESORT</small></div>
<h1 id="title"></h1><p id="subtitle"></p></header>
<nav class="langs" id="langs"></nav>
<main><p class="intro" id="intro"></p><section class="cards" id="cards"></section></main>
<footer><strong id="reserve"></strong><br><span id="note"></span><br><small>BLUE REEF RESORT • MARSA ALAM</small></footer>
<script>

const keys=['en','it','de','cs','pl'];
const flags={en:'🇬🇧',it:'🇮🇹',de:'🇩🇪',cs:'🇨🇿',pl:'🇵🇱'};
let current='en';
function render(lang){
 current=lang;const t=T[lang];document.documentElement.lang=lang;
 document.getElementById('title').textContent=t.title;
 document.getElementById('subtitle').textContent=t.subtitle;
 document.getElementById('intro').textContent=t.scan;
 document.getElementById('reserve').textContent=t.reserve;
 document.getElementById('note').textContent=t.note;
 document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 const cards=[
  {name:t.sea,price:'€30',basis:t.per_person,img:'seafood-menu.png',starter:t.shrimp_cocktail,main:t.seafood_mix,dessert:t.ice_fruit},
  {name:t.mix,price:'€25',basis:t.per_person,img:'mix-grill-menu.png',starter:t.mix_starter,main:t.mix_main,served:t.served,dessert:t.ice_fruit},
  {name:t.exclusive,price:'€50',basis:t.per_couple,img:'exclusive-seafood-menu.png',starter:t.two_cocktails,main:t.one_kg,served:t.side,dessert:t.two_desserts}
 ];
 document.getElementById('cards').innerHTML=cards.map(c=>`<article class="card"><img src="${c.img}" alt="${c.name}"><div class="content"><h2>${c.name}</h2><div class="price">${c.price} <small>${c.basis || ''}</small></div><h3>${t.starter}</h3><p>${c.starter}</p><h3>${t.main}</h3><p>${c.main}</p>${c.served?`<p><em>${c.served}</em></p>`:''}<h3>${t.dessert}</h3><p>${c.dessert}</p></div></article>`).join('');
}
document.getElementById('langs').innerHTML=keys.map(k=>`<button data-lang="${k}" onclick="render('${k}')">${flags[k]} ${T[k].lang}</button>`).join('');
render('en');
</script></body></html>
